<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="260"
  viewBox="0 0 900 260"
>

  <defs>

    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12051f"/>
      <stop offset="50%" stop-color="#1d0b32"/>
      <stop offset="100%" stop-color="#090014"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- BACKGROUND -->

  <rect
    x="0"
    y="0"
    width="900"
    height="260"
    rx="18"
    fill="url(#background)"
  />


  <!-- BORDER -->

  <rect
    x="1"
    y="1"
    width="898"
    height="258"
    rx="18"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    opacity="0.8"
  />


  <!-- HEADER -->

  <text
    x="35"
    y="45"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
  >
    GitHub Profile
  </text>

  <text
    x="35"
    y="70"
    fill="#a855f7"
    font-family="monospace"
    font-size="14"
  >
    @ernestjesutinafaton-maker
  </text>


  <!-- ACCENT LINE -->

  <rect
    x="35"
    y="88"
    width="830"
    height="2"
    rx="1"
    fill="url(#accent)"
    filter="url(#glow)"
  />


  <!-- STAT CARDS -->

  <g font-family="Arial, Helvetica, sans-serif">

    <!-- REPOSITORIES -->

    <rect
      x="35"
      y="110"
      width="150"
      height="105"
      rx="12"
      fill="#ffffff"
      fill-opacity="0.035"
      stroke="#a855f7"
      stroke-opacity="0.35"
    />

    <text
      x="55"
      y="140"
      fill="#a855f7"
      font-size="13"
      font-weight="700"
    >
      REPOSITORIES
    </text>

    <text
      x="55"
      y="180"
      fill="#ffffff"
      font-size="30"
      font-weight="700"
    >
      7
    </text>


    <!-- FOLLOWERS -->

    <rect
      x="205"
      y="110"
      width="150"
      height="105"
      rx="12"
      fill="#ffffff"
      fill-opacity="0.035"
      stroke="#d946ef"
      stroke-opacity="0.35"
    />

    <text
      x="225"
      y="140"
      fill="#d946ef"
      font-size="13"
      font-weight="700"
    >
      FOLLOWERS
    </text>

    <text
      x="225"
      y="180"
      fill="#ffffff"
      font-size="30"
      font-weight="700"
    >
      13
    </text>


    <!-- STARS -->

    <rect
      x="375"
      y="110"
      width="150"
      height="105"
      rx="12"
      fill="#ffffff"
      fill-opacity="0.035"
      stroke="#22d3ee"
      stroke-opacity="0.35"
    />

    <text
      x="395"
      y="140"
      fill="#22d3ee"
      font-size="13"
      font-weight="700"
    >
      TOTAL STARS
    </text>

    <text
      x="395"
      y="180"
      fill="#ffffff"
      font-size="30"
      font-weight="700"
    >
      0
    </text>


    <!-- CONTRIBUTIONS -->

    <rect
      x="545"
      y="110"
      width="150"
      height="105"
      rx="12"
      fill="#ffffff"
      fill-opacity="0.035"
      stroke="#a855f7"
      stroke-opacity="0.35"
    />

    <text
      x="565"
      y="140"
      fill="#a855f7"
      font-size="13"
      font-weight="700"
    >
      CONTRIBUTIONS
    </text>

    <text
      x="565"
      y="180"
      fill="#ffffff"
      font-size="30"
      font-weight="700"
    >
      69
    </text>


    <!-- STREAK -->

    <rect
      x="715"
      y="110"
      width="150"
      height="105"
      rx="12"
      fill="#ffffff"
      fill-opacity="0.035"
      stroke="#22d3ee"
      stroke-opacity="0.35"
    />

    <text
      x="735"
      y="140"
      fill="#22d3ee"
      font-size="13"
      font-weight="700"
    >
      CURRENT STREAK
    </text>

    <text
      x="735"
      y="180"
      fill="#ffffff"
      font-size="30"
      font-weight="700"
    >
      4
    </text>

  </g>


  <!-- FOOTER -->

  <text
    x="35"
    y="242"
    fill="#64748b"
    font-family="monospace"
    font-size="11"
  >
    commits 21 • issues 13 • PRs 1 • longest streak 4
  </text>

</svg>
